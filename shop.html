<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر لمسة أنثى - الرئيسية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; scroll-behavior: smooth; }
        body { background-color: #faf6f7; color: #333; padding-bottom: 80px; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background-color: #fff; box-shadow: 0 2px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 26px; font-weight: 700; color: #d65a7a; }
        .menu-icon { display: block; font-size: 30px; cursor: pointer; color: #d65a7a; user-select: none; }
        
        .nav-links { display: none; flex-direction: column; position: absolute; top: 80px; left: 20px; width: 250px; background-color: #fff; box-shadow: 0 10px 25px rgba(0,0,0,0.15); padding: 20px; border-radius: 10px; text-align: center; z-index: 999; }
        .nav-links.active { display: flex; }
        .nav-links a { text-decoration: none; color: #555; font-weight: bold; margin: 10px 0; transition: 0.3s; }
        .nav-links a:hover { color: #d65a7a; }
        
        .login-link { border-top: 1px solid #eee; padding-top: 15px !important; margin-top: 15px !important; color: #d65a7a !important; }
        .welcome-msg { font-size: 16px; color: #d65a7a; font-weight: bold; margin-top: 5px; }

        .hero { background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1567401893414-76b7b1e5a7a5?auto=format&fit=crop&w=1200&q=80'); background-size: cover; background-position: center; height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: white; padding: 20px; }
        .hero h1 { font-size: 50px; margin-bottom: 15px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .hero p { font-size: 22px; margin-bottom: 30px; }
        
        .categories-section { padding: 60px 20px; text-align: center; max-width: 1000px; margin: 0 auto; }
        .categories-section h2 { font-size: 36px; color: #d65a7a; margin-bottom: 40px; }
        
        .cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; }
        .cat-card { background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.05); transition: 0.3s; text-decoration: none; color: #333; display: block; }
        .cat-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .cat-card img { width: 100%; height: 200px; object-fit: cover; }
        .cat-card h3 { padding: 20px; font-size: 24px; color: #d65a7a; }
        
        .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #fff; box-shadow: 0 -2px 15px rgba(0,0,0,0.1); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .cart-info { font-weight: bold; font-size: 18px; color: #333; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .cart-count { background-color: #d65a7a; color: white; border-radius: 50%; padding: 2px 8px; font-size: 14px; }
        .checkout-btn { background-color: #25D366; color: white; border: none; padding: 12px 25px; border-radius: 30px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }

        /* تصميم النوافذ المنبثقة (السلة وإتمام الطلب) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: #fff; width: 90%; max-width: 450px; padding: 30px; border-radius: 15px; max-height: 85vh; overflow-y: auto; color: #333; }
        .modal-content h2 { color: #d65a7a; text-align: center; margin-bottom: 20px; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding: 10px 0; font-size: 16px; }
        .remove-btn { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        
        /* تصميم خانات شاشة إتمام الطلب */
        .checkout-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; font-family: 'Tajawal', sans-serif; }
        .checkout-input:focus { border-color: #d65a7a; }
        .confirm-btn { background-color: #25D366; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; margin-bottom: 10px; }
        .cancel-btn { background: #ccc; color: #333; border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        footer { background-color: #333; color: #ccc; text-align: center; padding: 30px; margin-top: 50px; }
        @media (max-width: 768px) { .navbar { padding: 15px 20px; flex-direction: column; gap: 10px; } .nav-links { width: 90%; left: 5%; } .hero h1 { font-size: 32px; } .cart-bar { flex-direction: column; gap: 10px; } .checkout-btn { width: 100%; } }
    </style>
</head>
<body>
    <script>
        // 🛑 حماية المتجر
        if (!localStorage.getItem('loggedInUser')) { window.location.href = 'login.html'; }
    </script>

    <nav class="navbar">
        <div>
            <div class="logo">🌸 لمسة أنثى</div>
            <div id="welcome-msg" class="welcome-msg"></div>
        </div>
        <div class="nav-links" id="nav-links">
            <a href="shop.html" style="color: #d65a7a;">الرئيسية</a>
            <a href="clothes.html">ملابس</a>
            <a href="makeup.html">مكياجات</a>
            <a href="toys.html">ألعاب أطفال</a>
            <a href="login.html" class="login-link" id="auth-action-btn">👤 تسجيل الدخول / حسابي</a>
        </div>
        <div class="menu-icon" id="menu-icon">☰</div>
    </nav>

    <header class="hero">
        <h1>أهلاً بكِ في عالم الأناقة والجمال</h1>
        <p>اكتشفي أقسامنا المتنوعة واختاري ما يناسبك.</p>
    </header>

    <section class="categories-section">
        <h2>تسوقي حسب القسم</h2>
        <div class="cat-grid">
            <a href="clothes.html" class="cat-card">
                <img src="https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=500&q=60" alt="ملابس">
                <h3>👗 ملابس</h3>
            </a>
            <a href="makeup.html" class="cat-card">
                <img src="https://images.unsplash.com/photo-1586495777744-4413f21062fa?auto=format&fit=crop&w=500&q=60" alt="مكياجات">
                <h3>💄 مكياجات</h3>
            </a>
            <a href="toys.html" class="cat-card">
                <img src="https://images.unsplash.com/photo-1558060370-d644479cb6f7?auto=format&fit=crop&w=500&q=60" alt="ألعاب أطفال">
                <h3>🧸 ألعاب أطفال</h3>
            </a>
        </div>
    </section>

    <footer><p>© 2024 متجر لمسة أنثى. جميع الحقوق محفوظة.</p></footer>

    <div class="cart-bar">
        <div class="cart-info" onclick="showCart()">🛒 عرض السلة <span class="cart-count" id="cart-count">0</span></div>
        <button class="checkout-btn" onclick="openCheckout()">إتمام الطلب ✅</button>
    </div>

    <!-- 1. نافذة عرض السلة -->
    <div class="modal-overlay" id="cart-modal">
        <div class="modal-content">
            <h2>سلة المشتريات</h2>
            <div id="cart-items"></div>
            <button class="cancel-btn" style="margin-top: 20px;" onclick="closeModal('cart-modal')">إغلاق</button>
        </div>
    </div>

    <!-- 2. نافذة إتمام الطلب الاحترافية (الجديدة) -->
    <div class="modal-overlay" id="checkout-modal">
        <div class="modal-content">
            <h2>تأكيد بيانات الشحن</h2>
            <input type="text" id="checkoutName" class="checkout-input" placeholder="الاسم بالكامل">
            <input type="tel" id="checkoutPhone" class="checkout-input" placeholder="رقم الهاتف">
            <textarea id="checkoutAddress" class="checkout-input" rows="3" placeholder="العنوان بالتفصيل (المدينة، المنطقة، الشارع)"></textarea>
            
            <button class="confirm-btn" onclick="submitOrder()">تأكيد الطلب وإرسال للواتساب ✅</button>
            <button class="cancel-btn" onclick="closeModal('checkout-modal')">إلغاء</button>
        </div>
    </div>

    <script>
        // --- كود الحساب ---
        const userName = localStorage.getItem('userName');
        if (userName) { document.getElementById('welcome-msg').innerText = 'أهلاً بك يا ' + userName + ' 🌸'; }
        
        const authBtn = document.getElementById('auth-action-btn');
        if (localStorage.getItem('loggedInUser')) {
            authBtn.innerText = '👤 تسجيل الخروج'; authBtn.href = '#';
            authBtn.onclick = function(e) { e.preventDefault(); localStorage.removeItem('loggedInUser'); localStorage.removeItem('userName'); window.location.href = 'login.html'; };
        }

        // --- كود القائمة والسلة ---
        const menuIcon = document.getElementById('menu-icon');
        const navLinks = document.getElementById('nav-links');
        menuIcon.addEventListener('click', () => { navLinks.classList.toggle('active'); menuIcon.textContent = navLinks.classList.contains('active') ? '✕' : '☰'; });

        let cart = JSON.parse(localStorage.getItem('anaqaCart')) || [];
        function updateCartCount() { document.getElementById('cart-count').innerText = cart.length; }
        updateCartCount();

        function showCart() {
            let itemsDiv = document.getElementById('cart-items'); itemsDiv.innerHTML = '';
            if (cart.length === 0) {
                itemsDiv.innerHTML = '<p style="text-align:center;">السلة فارغة</p>';
            } else {
                cart.forEach((item, index) => {
                    let sizeText = item.size ? ` (مقاس: ${item.size})` : '';
                    itemsDiv.innerHTML += `<div class="cart-item"><span>${item.name}${sizeText}</span><span>$${item.price} <button class="remove-btn" onclick="removeItem(${index})">❌</button></span></div>`;
                });
            }
            document.getElementById('cart-modal').style.display = 'flex';
        }

        function removeItem(index) {
            cart.splice(index, 1); localStorage.setItem('anaqaCart', JSON.stringify(cart));
            updateCartCount(); showCart(); 
        }

        function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }

        // --- الكود الجديد لإتمام الطلب ---
        function openCheckout() {
            if (cart.length === 0) { alert("السلة فارغة! أضيفي بعض المنتجات أولاً."); return; }
            
            // تعبئة البيانات تلقائياً من حساب المستخدم
            document.getElementById('checkoutName').value = localStorage.getItem('userName') || '';
            document.getElementById('checkoutPhone').value = localStorage.getItem('userPhone') || '';
            document.getElementById('checkoutAddress').value = '';
            
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function submitOrder() {
            let name = document.getElementById('checkoutName').value;
            let phone = document.getElementById('checkoutPhone').value;
            let address = document.getElementById('checkoutAddress').value;

            if (!name || !phone || !address) {
                alert("يرجى تعبئة جميع البيانات!");
                return;
            }

            let message = "مرحباً، طلب جديد:\n\n👤 الاسم: " + name + "\n📍 العنوان: " + address + "\n📞 الهاتف: " + phone + "\n\n🛍️ المنتجات:\n";
            let total = 0;
            cart.forEach((item, index) => { 
                let sizeText = item.size ? ` (مقاس: ${item.size})` : '';
                message += (index + 1) + ". " + item.name + sizeText + " - $" + item.price + "\n"; total += item.price; 
            });
            message += "\n💰 الإجمالي: $" + total;
            
            window.location.href = "https://wa.me/905343283015?text=" + encodeURIComponent(message);
            localStorage.removeItem('anaqaCart'); cart = []; updateCartCount(); closeModal('checkout-modal');
        }
    </script>
</body>
</html>
