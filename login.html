 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - لمسة أنثى</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: #faf6f7; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); width: 90%; max-width: 400px; text-align: center; }
        .auth-box h2 { color: #d65a7a; margin-bottom: 20px; }
        .auth-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; }
        .auth-box input:focus { border-color: #d65a7a; }
        .auth-btn { background-color: #d65a7a; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
        .auth-btn:hover { background-color: #b84664; }
        .toggle-btn { background: none; border: none; color: #555; font-weight: bold; cursor: pointer; text-decoration: underline; font-size: 14px; }
        .back-link { display: block; margin-top: 20px; color: #777; text-decoration: none; }
        .error-msg { color: red; font-size: 14px; margin-bottom: 10px; display: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="auth-box">
        <h2 id="form-title">تسجيل الدخول</h2>
        <p id="error-msg" class="error-msg"></p>
        
        <input type="text" id="regName" placeholder="الاسم الكامل" style="display: none;">
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        
        <button class="auth-btn" id="main-btn" onclick="handleAuth()">دخول</button>
        <button class="toggle-btn" id="toggle-btn" onclick="toggleMode()">ليس لديك حساب؟ إنشاء حساب جديد</button>
        
        <a href="shop.html" class="back-link">العودة للمتجر</a>
    </div>

    <script>
        const API_KEY = "AIzaSyDx8obeXUmRsx8iNTa5BXE6768CUo3cAEw";
        let isLoginMode = true;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('form-title').innerText = isLoginMode ? 'تسجيل الدخول' : 'إنشاء حساب جديد';
            document.getElementById('main-btn').innerText = isLoginMode ? 'دخول' : 'إنشاء الحساب';
            document.getElementById('toggle-btn').innerText = isLoginMode ? 'ليس لديك حساب؟ إنشاء حساب جديد' : 'لديك حساب بالفعل؟ تسجيل الدخول';
            document.getElementById('error-msg').style.display = 'none';
            document.getElementById('regName').style.display = isLoginMode ? 'none' : 'block';
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('regName').value;
            const errorMsg = document.getElementById('error-msg');
            
            if (!email || !password) {
                errorMsg.innerText = "يرجى إدخال البريد الإلكتروني وكلمة المرور";
                errorMsg.style.display = 'block';
                return;
            }

            if (!isLoginMode && !name) {
                errorMsg.innerText = "يرجى إدخال الاسم الكامل";
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';
            document.getElementById('main-btn').innerText = "جاري المعالجة...";

            const url = isLoginMode 
                ? `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEY}`
                : `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${API_KEY}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password, returnSecureToken: true })
                });
                const data = await response.json();

                if (response.ok) {
                    if (!isLoginMode) {
                        // --- إنشاء حساب جديد ---
                        localStorage.setItem('userName', name);
                        
                        // إرسال إيميل التأكيد
                        const idToken = data.idToken;
                        await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=${API_KEY}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ requestType: "VERIFY_EMAIL", idToken: idToken })
                        });

                        alert("تم إنشاء الحساب بنجاح! يرجى تفقد بريدك الإلكتروني والضغط على رابط التأكيد قبل تسجيل الدخول.");
                        toggleMode(); // العودة لشاشة تسجيل الدخول
                    } else {
                        // --- تسجيل دخول ---
                        if (data.emailVerified === false) {
                            errorMsg.innerText = "حسابك غير مفعل! يرجى تفقد بريدك الإلكتروني والضغط على رابط التأكيد.";
                            errorMsg.style.display = 'block';
                        } else {
                            // الحساب مفعل، ندخله للمتجر
                            localStorage.setItem('loggedInUser', email);
                            alert("تم تسجيل الدخول بنجاح!");
                            window.location.href = 'shop.html';
                        }
                    }
                } else {
                    errorMsg.innerText = "خطأ: " + data.error.message;
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.innerText = "فشل الاتصال بالشبكة. يرجى التحقق من الإنترنت.";
                errorMsg.style.display = 'block';
            } finally {
                document.getElementById('main-btn').innerText = isLoginMode ? 'دخول' : 'إنشاء الحساب';
            }
        }
    </script>
</body>
</html>
